[package]
name = "bonbo-executor"
version.workspace = true
edition.workspace = true
description = "Order execution with Saga pattern for Binance Futures"
authors.workspace = true
license.workspace = true

[features]
default = ["vwap", "twap", "pov", "is", "ofi", "flash", "smart-market"]
vwap = []
twap = []
pov = []
is = []
ofi = []
flash = []
smart-market = []

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
rust_decimal = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = "0.1"
bonbo-binance-futures = { path = "../bonbo-binance-futures" }
bonbo-data = { path = "../bonbo-data" }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
